# Conexion con fallback a local (SIN LA PALABRA PROHIBIDA)
spring.datasource.url=${DB_URI:jdbc:postgresql://localhost:5433/biblioteca_db}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpass}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect